[dev]
image=fedora
pull=true
root=false
init=false
start_now=false

additional_packages="rustup neovim nushell python3 python3-pip python3-devel pipx gcc gcc-c++ clang lld cmake ninja-build make git git-lfs gh gdb lldb jq yq ripgrep fd-find fzf tree htop shellcheck pkgconf-pkg-config openssl-devel sqlite-devel libffi-devel zlib-ng-compat-devel util-linux-user"

init_hooks="grep -qxF /usr/bin/nu /etc/shells || echo /usr/bin/nu >> /etc/shells; chsh -s /usr/bin/nu freddie"
